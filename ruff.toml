line-length = 79
lint.extend-safe-fixes = [
  # non-pep585-annotation
  "UP006",
]
lint.select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # pycodestyle
  "E",
  # Pyflakes errors
  "F",
  # isort
  "I",
  # flake8-simplify
  "SIM",
  # flake8-tidy-imports
  "TID",
  # pyupgrade
  "UP",
  # Pyflakes warnings
  "W",
  # flake8-logging
  "LOG",
  # flake8-logging-format
  "G",
  # flake8-pie
  "PIE",
  # flake8-return
  "RET",
  # flake8-slots
  "SLOT",
  # pygrep-hooks
  "PGH",
  # perflint
  "PERF",
  # flake8-use-pathlib
  "PTH",
  # unnecessary-iterable-allocation-for-first-element
  "RUF015",
]
lint.ignore = [
  # flake8-bugbear opinionated rules
  "B9",
  # line-too-long
  "E501",
  # suppressible-exception
  "SIM105",
  # if-else-block-instead-of-if-exp
  "SIM108",
  # printf-string-formatting
  "UP031",
]
