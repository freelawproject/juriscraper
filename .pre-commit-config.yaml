ci:
  autoupdate_schedule: quarterly
  # pyrefly needs the project environment (uv); pre-commit.ci can't provide
  # it. The Lint workflow runs the same check.
  skip: [ pyrefly ]
exclude: '^tests/examples/.*\.html$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
     - id: check-added-large-files
     - id: check-ast
     - id: check-json
     - id: check-merge-conflict
     - id: check-toml
     - id: check-yaml
     - id: debug-statements
     - id: detect-private-key
     - id: fix-byte-order-marker
     - id: fix-encoding-pragma
       args: [--remove]
     - id: trailing-whitespace
       args: [--markdown-linebreak-ext=md]
       exclude: ^tests/examples/pacer/nef/s3/.*\.txt$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Runs in the project environment (not an isolated hook environment) so the
  # checker sees our dependencies; always checks the whole project because the
  # checked file set is defined by project-includes in pyproject.toml.
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        files: '(\.py$|^pyrefly\.toml$|^\.pyrefly-baseline\.json$)'
